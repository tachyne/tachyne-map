<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tachyne map</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
  #view { display: block; width: 100%; height: 100%; }

  /* Heads-up display (top-left) */
  #hud {
    position: fixed; top: 8px; left: 8px;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #fff; background: rgba(0, 0, 0, 0.45);
    padding: 6px 10px; border-radius: 6px;
    pointer-events: none; white-space: pre; user-select: none;
  }

  /* Loading / error banner (top-center) */
  #status {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #fff; background: rgba(0, 0, 0, 0.55);
    padding: 6px 14px; border-radius: 6px;
    pointer-events: none; user-select: none;
  }
  #status.hidden { display: none; }
  #status.error { background: rgba(160, 32, 32, 0.85); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">loading…</div>
<div id="status">loading…</div>

<!-- Map the bare "three" specifier (used by OrbitControls.js) to the vendored build. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
